<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meals">
<meta name="theme-color" content="#0F1114">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Meal Planner</title>
<style>
:root{--bg-app:#EFE8DD;--bg-card:#F8F2E9;--bg-alt:#EAE1D3;--bg-in:#F3ECE0;--text:#2E2A24;--text2:#5A5347;--text3:#948A79;--textop:#FFFFFF;--bdr:#E0D6C6;--bdrs:#EBE2D4;--pr:#B05334;--prd:#8F3F25;--prl:#EFE0D5;--secondary:#6E7356;--secondary-tint:#E6E4D2;--secondary-ink:#565C32;--ok:#5C7A3A;--warn:#A8670F;--danger:#A8462E;--info:#5A6E66;--chip-bg:#EAE3D4;--chip-fg:#6A6150;--glass:#F8F2E9;--glass-strong:#FBF6EF;--glass-bdr:#E6DCCB;--bg-grad1:#EFE8DD;--bg-grad2:#EBE3D6;--bg-grad3:#F1EADF;--navglass:#F1E9DD;--nh:64px;--font:system-ui,-apple-system,"Segoe UI",sans-serif}
html[data-theme="dark"]{--bg-app:#1B1916;--bg-card:#262320;--bg-alt:#2F2B25;--bg-in:#2A2723;--text:#ECE6DC;--text2:#C3BBAD;--text3:#A49C8E;--textop:#21180F;--bdr:#3A352D;--bdrs:#322E27;--pr:#D08A5E;--prd:#B5734A;--prl:#33291F;--secondary:#9FA67E;--secondary-tint:#33372E;--secondary-ink:#C7CBA6;--ok:#8FB06A;--warn:#D9A24A;--danger:#E08A6E;--info:#8FB0A6;--chip-bg:#322E27;--chip-fg:#BCB3A2;--glass:#262320;--glass-strong:#2B2823;--glass-bdr:#3A352D;--bg-grad1:#1B1916;--bg-grad2:#1B1916;--bg-grad3:#1F1C18;--navglass:#211E1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;overflow:hidden}
html{background:var(--bg-app)}
body{display:flex;flex-direction:column;background:var(--bg-app)}
#app{flex:1;overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(var(--nh) + 40px);-webkit-overflow-scrolling:touch}
.screen:has(.sticky){padding-bottom:calc(var(--nh) + 120px)}
#nav{height:var(--nh);background:var(--navglass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--glass-bdr);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text3);padding:8px 0;position:relative;-webkit-tap-highlight-color:transparent}
.nt.active{color:var(--pr)}
.nt.active::before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--pr);border-radius:0 0 2px 2px}
.nt svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nt .nl{font-size:11px;font-weight:500}
.card{background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-radius:16px;padding:16px;border:1px solid var(--glass-bdr);box-shadow:0 4px 20px rgba(40,50,42,.07)}
.card+.card{margin-top:8px}
.card-alt{background:var(--bg-alt)}
.btn-p{display:block;width:100%;background:var(--pr);color:var(--textop);border:none;border-radius:18px;height:52px;font-size:16px;font-weight:600;letter-spacing:.01em;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 10px rgba(40,50,42,.22),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-p:active{background:var(--prd)}
.btn-s{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1.5px solid var(--pr);color:var(--pr);border-radius:22px;height:44px;padding:0 16px;font-size:15px;cursor:pointer}
.btn-t{background:none;border:none;color:var(--pr);font-size:15px;cursor:pointer;min-height:44px;padding:0 8px}
.btn-d{background:var(--danger);color:var(--textop);border:none;border-radius:26px;height:44px;padding:0 16px;font-size:15px;font-weight:600;cursor:pointer}
.fab{position:fixed;bottom:calc(var(--nh)+20px);right:16px;width:56px;height:56px;border-radius:50%;background:var(--pr);border:none;color:var(--textop);font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:100;-webkit-tap-highlight-color:transparent}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:500;background:var(--chip-bg);color:var(--chip-fg);white-space:nowrap}
.chip.sel{background:var(--pr);color:var(--textop)}
.chip.base{background:var(--secondary-tint);color:var(--secondary-ink)}
.chip.finish{background:var(--prl);color:var(--prd)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:12px;font-weight:500;color:var(--text3);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-bdr);border-radius:12px;color:var(--text);font-size:15px;font-family:var(--font)}
.fld input,.fld select{height:48px;padding:0 12px}
.fld textarea{padding:12px;min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--pr);outline-offset:1px}
.fld input::placeholder,.fld textarea::placeholder{color:var(--text3)}
.stars{display:flex;gap:4px}
.star{font-size:30px;cursor:pointer;color:var(--text3);opacity:.45;line-height:1;-webkit-tap-highlight-color:transparent}
.star.on{opacity:1}
.star.on{color:var(--pr)}
.gr-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--bdrs);min-height:48px}
.gr-row:last-child{border-bottom:none}
.gr-chk{width:24px;height:24px;border:2px solid var(--bdr);border-radius:50%;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s;-webkit-tap-highlight-color:transparent}
.gr-chk.on{background:var(--pr);border-color:var(--pr)}
.gr-chk.on::after{content:"✓";color:var(--textop);font-size:14px;font-weight:700}
.gr-txt{flex:1}
.gr-name{font-size:15px;transition:all .2s}
.gr-note{font-size:13px;color:var(--text3)}
.gr-row.chk .gr-name{text-decoration:line-through;opacity:.4}
.day-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bdrs);min-height:56px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.day-row:last-child{border-bottom:none}
.day-lbl{font-size:13px;color:var(--text3);width:52px;flex-shrink:0}
.day-ctr{flex:1;min-width:0}
.day-ttl{font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.day-sub{font-size:13px;color:var(--text3)}
.day-rt{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cchk{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.cchk.done{background:var(--pr);color:var(--textop)}.cchk.todo{border:2px solid var(--bdr)}
.banner{border-radius:8px;padding:12px 16px;display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.bw{background:var(--prl);color:var(--prd)}.bi{background:var(--secondary-tint);color:var(--secondary-ink)}
.bi2{background:var(--secondary-tint);color:var(--secondary-ink)}
.banner .bico{font-size:18px;flex-shrink:0}
.banner .bbody{flex:1;font-size:13px;line-height:1.4}
.banner .bx{background:none;border:none;color:var(--pr);font-size:13px;cursor:pointer;min-height:44px;padding:0;flex-shrink:0}
.rc{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--bdr);cursor:pointer;-webkit-tap-highlight-color:transparent}
.rc:active{background:var(--bg-alt)}
.av{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:white;flex-shrink:0}
.rc-info{flex:1;min-width:0}
.rc-ttl{font-size:17px;font-weight:600;margin-bottom:4px}
.rc-meta{font-size:13px;color:var(--text3);display:flex;gap:12px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-b{background:var(--secondary-tint);color:var(--secondary-ink)}.badge-f{background:var(--prl);color:var(--prd)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-top:8px}
.sh .back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--pr);cursor:pointer;font-size:22px;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.sh .stitle{font-size:24px;font-weight:700}
.sec{font-size:20px;font-weight:700;margin:20px 0 12px}
.ssec{font-size:15px;font-weight:600;color:var(--text2);margin:16px 0 8px}
.prg-w{height:4px;background:var(--bdr);border-radius:2px;margin-bottom:16px}
.prg-f{height:100%;background:var(--pr);border-radius:2px;transition:width .3s}
.prg-l{font-size:13px;color:var(--text3);margin-bottom:8px}
.sticky{position:fixed;left:0;right:0;bottom:calc(var(--nh) + env(safe-area-inset-bottom));z-index:60;padding:12px 16px;background:var(--navglass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--glass-bdr)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end}
.ov.hidden{display:none!important}
.sheet{background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--glass-bdr);border-radius:22px 22px 0 0;width:100%;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;animation:up .3s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hdl{width:36px;height:4px;background:var(--bdr);border-radius:2px;margin:12px auto;flex-shrink:0}
.shd{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;flex-shrink:0}
.sht{font-size:20px;font-weight:700}
.shb{overflow-y:auto;padding:0 16px 48px;flex:1}
.more-row{display:flex;align-items:center;padding:16px 0;border-bottom:1px solid var(--bdr);cursor:pointer;gap:12px;min-height:56px;-webkit-tap-highlight-color:transparent}
.more-row:active{background:var(--bg-alt)}
.mico{font-size:22px;width:32px;text-align:center}
.mlbl{flex:1;font-size:17px}
.mchev{color:var(--text3);font-size:18px}
#toast{position:fixed;bottom:calc(var(--nh)+70px);left:50%;transform:translateX(-50%);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--text);border-radius:24px;padding:12px 20px;font-size:15px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;border:1px solid var(--glass-bdr);box-shadow:0 6px 24px rgba(40,50,42,.16)}
#toast.show{opacity:1}
.sb{display:flex;align-items:center;background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid var(--glass-bdr);border-radius:14px;padding:0 12px;margin-bottom:16px;height:46px;gap:8px}
.sb input{flex:1;background:none;border:none;color:var(--text);font-size:15px;font-family:var(--font)}
.sb input:focus{outline:none}
.ing-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdrs)}
.ing-row:last-child{border-bottom:none}
.ii{flex:2;font-size:15px}.iq{width:44px;font-size:15px;text-align:right;color:var(--text2)}.iu{min-width:48px;font-size:13px;color:var(--text3)}
.batch-card{background:var(--bg-card);border-radius:16px;padding:16px;border:1px solid var(--bdr);margin-bottom:16px}
.conf-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.conf-ov.hidden{display:none!important}
.conf{background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-bdr);border-radius:18px;padding:20px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(40,50,42,.22)}
.conf h3{font-size:20px;font-weight:700;margin-bottom:12px}
.conf p{font-size:15px;color:var(--text2);margin-bottom:20px}
.conf-acts{display:flex;gap:12px}
.conf-acts button{flex:1}
#loading{position:fixed;inset:0;background:var(--bg-app);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;gap:16px}
#loading.hidden{display:none!important}
.spin{width:40px;height:40px;border:3px solid var(--bdr);border-top-color:var(--pr);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.divider{height:1px;background:var(--bdrs);margin:8px 0}
.tr{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.step-txt{font-size:15px;color:var(--text2);padding:8px 0;border-bottom:1px solid var(--bdrs);line-height:1.6}
.step-txt:last-child{border-bottom:none}
.step-n{color:var(--pr);font-weight:700;margin-right:6px}
.feed-entry{padding:10px 0;border-bottom:1px solid var(--bdrs);font-size:13px;color:var(--text2)}
.feed-date{font-size:11px;color:var(--text3);margin-bottom:4px}
.ratings-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.rat-item{text-align:center}
.rat-v{font-size:20px;font-weight:700;color:var(--pr)}
.rat-l{font-size:11px;color:var(--text3);margin-top:2px}
.pick-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bdrs);min-height:56px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pick-row:active{background:var(--bg-alt)}
.pick-row.sel-row{background:var(--prl);border-left:3px solid var(--pr)}
.pick-info{flex:1;min-width:0}
.pick-ttl{font-size:15px;font-weight:600}
.pick-meta{font-size:13px;color:var(--text3)}
.pu-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bdrs)}
.pu-item{flex:1;font-size:15px}
.pu-det{font-size:13px;color:var(--text3)}
.section-divider{text-align:center;font-size:12px;color:var(--text3);padding:8px 0;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
</style>
<style>
/* =====================================================================
   SAGE — personal design system
   Drop-in restyle for the Meal Planner app. Dark-first, flat, hairline.
   Reuses the app's existing CSS variable NAMES, so every existing screen
   re-themes automatically. Also neutralises the old glassmorphism.

   HOW TO INSTALL
   1. In index.html, replace the two :root / html[data-theme="dark"]
      token lines in <style> with the token blocks below (or just paste
      this whole file into a <style> AFTER the existing one — the
      !important overrides will win).
   2. Default the app to dark: <html lang="en" data-theme="dark">.
   3. Load a heading font once in <head>:
      <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
   ===================================================================== */

/* ---- TOKENS : LIGHT (default) ------------------------------------ */
:root{
  --bg-app:#F3F4F1; --bg-card:#FFFFFF; --bg-alt:#EBEDE8; --bg-in:#EBEDE8;
  --text:#191C20; --text2:#586069; --text3:#888F98; --textop:#FFFFFF;
  --bdr:#DFE2DC; --bdrs:#ECEEE9;
  --pr:#4C7C5A; --prd:#3E6A4B; --prl:#E4EFE6;
  --secondary:#5C7A63; --secondary-tint:#E6EFE7; --secondary-ink:#3C5A43;
  --ok:#4C7C5A; --warn:#A8670F; --danger:#B65A3D; --info:#5A6E66;
  --chip-bg:#EBEDE8; --chip-fg:#586069;
  --glass:#FFFFFF; --glass-strong:#FFFFFF; --glass-bdr:#DFE2DC; --navglass:#FFFFFF;
  --bg-grad1:#F3F4F1; --bg-grad2:#F3F4F1; --bg-grad3:#F3F4F1;
  --font-head:'Schibsted Grotesk', system-ui, sans-serif;
}

/* ---- TOKENS : DARK (primary) ------------------------------------- */
html[data-theme="dark"]{
  --bg-app:#0F1114; --bg-card:#171A20; --bg-alt:#212630; --bg-in:#212630;
  --text:#F1F3F6; --text2:#A4ADBA; --text3:#69727E; --textop:#0E1A12;
  --bdr:#2A2F39; --bdrs:#20242C;
  --pr:#9CC39C; --prd:#8AB58A; --prl:#18231A;
  --secondary:#86A98F; --secondary-tint:#1F2A22; --secondary-ink:#A9C9B0;
  --ok:#9CC39C; --warn:#D9A24A; --danger:#E0876B; --info:#8FB0A6;
  --chip-bg:#212630; --chip-fg:#A4ADBA;
  --glass:#171A20; --glass-strong:#1A1E25; --glass-bdr:#2A2F39; --navglass:#171A20;
  --bg-grad1:#0F1114; --bg-grad2:#0F1114; --bg-grad3:#0F1114;
}

/* ---- FLAT : kill the glass everywhere ---------------------------- */
.card,#nav,.sticky,.sheet,.fld input,.fld select,.fld textarea,
.glass,.glass-strong{
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}
.card{
  background:var(--bg-card) !important;
  border:1px solid var(--bdr) !important;
  box-shadow:none !important;
  border-radius:16px;
}
#nav,.sticky{ background:var(--bg-card) !important; }
.sheet{ background:var(--bg-card) !important; }
.fld input,.fld select,.fld textarea{ background:var(--bg-alt) !important; }
html,body{ background:var(--bg-app) !important; }

/* Headings adopt the display face */
.sh .stitle,.sec,.day-ttl,.rc-ttl{ font-family:var(--font-head); letter-spacing:-0.01em; }

/* =====================================================================
   COOK SCREEN COMPONENTS  (used by cook.js)
   ===================================================================== */
.ck-head{ display:flex; justify-content:space-between; align-items:baseline; }
.ck-title{ font-family:var(--font-head); font-size:30px; font-weight:700; letter-spacing:-0.02em; color:var(--text); }
.ck-date{ font-size:12.5px; color:var(--text3); }

.ck-prog{ display:flex; align-items:center; gap:11px; margin-top:14px; }
.ck-track{ flex:1; height:3px; border-radius:2px; background:var(--bg-alt); overflow:hidden; }
.ck-fill{ height:100%; background:var(--pr); border-radius:2px; transition:width .3s; }
.ck-prog-l{ font-size:12px; color:var(--text2); white-space:nowrap; }

.ck-heads{ display:flex; align-items:center; gap:10px; padding:12px 0; margin-top:6px;
  border-top:1px solid var(--bdr); border-bottom:1px solid var(--bdr); }
.ck-heads .dot{ width:8px; height:8px; border-radius:3px; background:var(--pr); flex-shrink:0; }
.ck-heads .t{ font-size:13px; color:var(--text2); line-height:1.4; }

.ck-seclbl{ font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--text3);
  font-weight:600; margin:18px 0 4px; display:flex; justify-content:space-between; align-items:center; }

.ck-ent{ padding:15px 0; border-bottom:1px solid var(--bdr); }
.ck-ent-h{ display:flex; justify-content:space-between; align-items:center; }
.ck-meal{ font-size:12px; color:var(--text3); }
.ck-today{ font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--pr); }
.ck-slot-ttl{ font-family:var(--font-head); font-size:18px; font-weight:600; color:var(--text); margin-top:6px; }
.ck-meta{ font-size:12.5px; color:var(--text3); margin-top:5px; }
.ck-meta.logged{ color:var(--pr); }
.ck-planned{ font-size:12.5px; color:var(--text3); }

.ck-actions{ display:flex; gap:20px; align-items:center; margin-top:12px; }
.ck-acta{ color:var(--pr); font-size:13.5px; font-weight:600; background:none; border:none; padding:0; cursor:pointer; font-family:inherit; min-height:32px; }
.ck-actb{ color:var(--text2); font-size:13.5px; font-weight:500; background:none; border:none; padding:0; cursor:pointer; font-family:inherit; min-height:32px; }

.ck-collapsed{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
.ck-collapsed .t{ font-size:14px; color:var(--text2); }
.ck-collapsed .d{ color:var(--text3); }
.ck-collapsed .chk{ color:var(--pr); font-size:13px; font-weight:600; }

/* inline carousel */
.ck-rail{ margin-top:11px; display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;

  margin-right:-16px; padding-right:16px; }

.ck-card{ flex:0 0 150px; scroll-snap-align:start; background:transparent;
  border:1px solid var(--bdr); border-radius:13px; padding:13px; cursor:pointer;
  display:flex; flex-direction:column; gap:5px; -webkit-tap-highlight-color:transparent; }
.ck-card.sel{ border-color:var(--pr); background:var(--prl); }
.ck-card .ck-chip{ align-self:flex-start; }

.ck-card-none{ flex:0 0 100px; scroll-snap-align:start; border:1px solid var(--bdr);

  justify-content:center; text-align:center; color:var(--text3); font-size:12.5px; }
.ck-card-none.sel{ border-color:var(--pr); color:var(--pr); }

.ck-chip{ display:inline-flex; align-items:center; height:23px; padding:0 9px; border-radius:8px;

.ck-cancel{ font-size:12px; color:var(--text2); background:none; border:none; cursor:pointer; font-family:inherit; }

// ── Storage ──────────────────────────────────────────────────────────────────
const DB_NAME = 'meal-planner', DB_VER = 2;
const STORES = ['recipes','mealPlans','groceryLists','pantry','purchaseUnits','preferences','aliasMap','cookLog','cookbookBacklog','meta','inventory'];
let DB = null;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, {keyPath: s==='cookLog'?'id':'_key'}); });
    };
    req.onsuccess = e => { DB = e.target.result; res(DB); };
    req.onerror = e => rej(e.target.error);
  });
}

function dbGet(store, key) {
  return new Promise((res, rej) => {
    const tx = DB.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

function dbPut(store, val) {
  return new Promise((res, rej) => {
    const tx = DB.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(val);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}

function dbGetAll(store) {
  return new Promise((res, rej) => {
    const tx = DB.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const tx = DB.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}

function dbClear(store) {
  return new Promise((res, rej) => {
    const tx = DB.transaction(store, 'readwrite');
    const req = tx.objectStore(store).clear();
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}

async function seedDB() {
  const recipes = SEED.recipes;
  for (const r of recipes) await dbPut('recipes', {...r, _key: r.id});
  for (const p of SEED.mealPlans) await dbPut('mealPlans', {...p, _key: p.id});
  await dbPut('pantry', {...SEED.pantry, _key: 'singleton'});
  for (const pu of SEED.purchaseUnits) await dbPut('purchaseUnits', {...pu, _key: pu.itemNorm});
  await dbPut('preferences', {...SEED.preferences, _key: 'singleton'});
  await dbPut('aliasMap', {data: SEED.aliasMap, _key: 'singleton'});
  for (const cl of (SEED.cookLog||[])) await dbPut('cookLog', cl);
  for (const cb of (SEED.cookbookBacklog||[])) await dbPut('cookbookBacklog', {...cb, _key: cb.filename});
  await dbPut('meta', {_key: 'singleton', seededAt: new Date().toISOString(), schemaVersion: 1});
}

// ── Grocery Algorithm (§5.3) ──────────────────────────────────────────────────
const AISLE_ORDER = ['frozen','dairy','refrigerated','spices','international','canned','pasta-grains','condiments','meat','produce','bakery'];
const PERISHABLE_AISLES = new Set(['produce','bakery']);
function planWeekCount(plan){
  const ds=plan.entries.map(e=>e.dayDate).filter(Boolean).sort();
  if(!ds.length) return 1;
  const start=new Date(ds[0]+'T00:00:00'), end=new Date(ds[ds.length-1]+'T00:00:00');
  return Math.max(1, Math.floor((end-start)/(7*86400000))+1);
}
function entryWeekIndex(plan, e){
  const ds=plan.entries.map(x=>x.dayDate).filter(Boolean).sort();
  if(!ds.length) return 1;
  const start=new Date(ds[0]+'T00:00:00'); const d=new Date((e.dayDate||ds[0])+'T00:00:00');
  return Math.max(1, Math.floor((d-start)/(7*86400000))+1);
}
function weekStartLabel(plan, k){
  const ds=plan.entries.map(e=>e.dayDate).filter(Boolean).sort();
  const start=new Date(ds[0]+'T00:00:00'); const d=new Date(start.getTime()+(k-1)*7*86400000);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function aisleIdx(a){ const i=AISLE_ORDER.indexOf(a); return i<0?AISLE_ORDER.length:i; }
function buildWeeklyLists(plan, rm, pantryItems, purchaseUnits, aliasMap){
  const weeks=planWeekCount(plan);
  const full=generateGroceryList(plan, rm, pantryItems, purchaseUnits, aliasMap, null);
  if(weeks<=1){ return { weekly:[{week:1,label:'Buy now',items:full.items}], unknownUnits:full.unknownUnits, warnings:full.warnings }; }
  const isP = it => PERISHABLE_AISLES.has(it.aisle);
  const shelf = full.items.filter(it=>!isP(it));
  const weekly=[];
  for(let k=1;k<=weeks;k++){
    const sub={...plan, entries:plan.entries.filter(e=>entryWeekIndex(plan,e)===k)};
    const wl=generateGroceryList(sub, rm, pantryItems, purchaseUnits, aliasMap, null);
    const persh=wl.items.filter(isP);
    if(k===1){
      const items=[...shelf,...persh].sort((a,b)=>aisleIdx(a.aisle)-aisleIdx(b.aisle));
      weekly.push({week:1,label:'Buy now',items});
    } else if(persh.length){
      persh.sort((a,b)=>aisleIdx(a.aisle)-aisleIdx(b.aisle));
      weekly.push({week:k,label:`Buy for week ${k} · around ${weekStartLabel(plan,k)}`,items:persh});
    }
  }
  return { weekly, unknownUnits:full.unknownUnits, warnings:full.warnings };
}

const PANTRY_AISLE_MAP = {pantry:'condiments'};
const CALORIE_WARN_BAND = () => state.preferences.calorieWarnBand || [1200, 1800];

const WEIGHT_TO_OZ = {oz:1, lb:16};
const VOL_TO_TSP = {tsp:1, tbsp:3, cup:48, 'fl oz':6};

function normItem(item, aliasMap) {
  const k = (item||'').trim().toLowerCase();
  return aliasMap[k] || k;
}

function normUnit(unit) {
  let u = (unit||'').trim().toLowerCase();
  u = u.replace(/\s*\(.*?\)/g,'').trim(); // strip (...)
  const map = {'stalk':'each','stalks':'each','bag':'each','bags':'each','jar':'each',
    'jars':'each','bottle':'each','bottles':'each','can':'each','cans':'each',
    'piece':'each','pieces':'each','cup grated':'cup','cups grated':'cup'};
  return map[u] || u;
}

function unitFamily(u) {
  if (WEIGHT_TO_OZ[u]) return 'weight';
  if (VOL_TO_TSP[u]) return 'volume';
  return 'count';
}

function toOz(qty, unit) { return qty * (WEIGHT_TO_OZ[unit] || 1); }
function toLb(qty, unit) { return unit==='oz' ? qty/16 : qty; }
function toTsp(qty, unit) { return qty * (VOL_TO_TSP[unit] || 1); }

function generateGroceryList(plan, recipeMap, pantryItems, purchaseUnits, aliasMap, existingList) {
  const pantrySet = new Set(pantryItems.map(x=>x.toLowerCase()));
  const puMap = {};
  purchaseUnits.forEach(pu => puMap[pu.itemNorm || pu._key] = pu);

  // Step 0: Collapse (recipeId, meal) groups, then collect line items
  const groups = {};
  for (const entry of plan.entries) {
    const key = entry.recipeId + '::' + entry.meal;
    if (!groups[key]) groups[key] = {recipeId: entry.recipeId, meal: entry.meal, totalServings: 0};
    groups[key].totalServings += entry.servings;
  }

  const lineItems = [];
  const warnings = [];

  for (const key of Object.keys(groups)) {
    const g = groups[key];
    const recipe = recipeMap[g.recipeId];
    if (!recipe) { warnings.push(`Missing recipe: ${g.recipeId}`); continue; }

    // Check missing base for finish recipes
    if (recipe.isFinish && recipe.baseRecipeId) {
      const baseInPlan = plan.entries.some(e => e.recipeId === recipe.baseRecipeId && e.meal === 'batch');
      if (!baseInPlan) {
        const baseRecipe = recipeMap[recipe.baseRecipeId];
        const baseName = baseRecipe ? baseRecipe.title : recipe.baseRecipeId;
        warnings.push(`⚠ Protein for "${recipe.title}" missing — add ${baseName} (batch) or buy protein separately`);
      }
    }

    const scale = g.totalServings / recipe.servings;
    for (const ing of recipe.ingredients) {
      const itemKey = normItem(ing.item, aliasMap);
      const unitKey = normUnit(ing.unit);
      let aisle = ing.aisle;
      if (PANTRY_AISLE_MAP[aisle]) aisle = PANTRY_AISLE_MAP[aisle];
      const scaledQty = ing.qty * scale;
      if (scaledQty <= 0) continue;
      lineItems.push({ item: itemKey, itemRaw: ing.item, qty: scaledQty, unit: unitKey, aisle, staple: !!ing.staple });
    }
  }

  // Step 1+2: Normalize & aggregate by (item, unit-family bucket)
  const agg = {};
  for (const li of lineItems) {
    const fam = unitFamily(li.unit);
    const aggKey = li.item + '||' + fam;
    if (!agg[aggKey]) {
      agg[aggKey] = { item: li.item, qty: 0, unit: li.unit, aisle: li.aisle, allStaple: true, family: fam };
    }
    const a = agg[aggKey];
    // Convert within family before summing
    if (fam === 'weight') {
      a.qty += toOz(li.qty, li.unit);
      a.unit = 'oz';
    } else if (fam === 'volume') {
      a.qty += toTsp(li.qty, li.unit);
      a.unit = 'tsp';
    } else {
      // count: only aggregate same unit
      if (a.unit !== li.unit) {
        // Different count units: keep separate
        const altKey = li.item + '||count||' + li.unit;
        if (!agg[altKey]) {
          agg[altKey] = { item: li.item, qty: 0, unit: li.unit, aisle: li.aisle, allStaple: true, family: 'count' };
        }
        agg[altKey].qty += li.qty;
        agg[altKey].allStaple = agg[altKey].allStaple && li.staple;
        continue;
      }
      a.qty += li.qty;
    }
    if (!a.aisle || a.aisle === 'pantry') a.aisle = li.aisle;
    a.allStaple = a.allStaple && li.staple;
  }

  // Step 3: Pantry subtract
  const items = [];
  const unknownUnits = [];
  for (const aggKey of Object.keys(agg)) {
    const a = agg[aggKey];
    if (a.allStaple && pantrySet.has(a.item)) continue; // drop
    items.push(a);
  }

  // Step 4: Round to purchase units & Step 5: Leftover flag
  const listItems = [];
  for (const a of items) {
    const pu = puMap[a.item];
    let buyQty, buyUnit, displayText, leftoverNote = null, missingPU = false, neededQty, neededUnit;

    // Convert back to readable unit for display
    if (a.family === 'weight') {
      neededQty = a.qty; neededUnit = 'oz';
      // Convert to lb if >= 16oz
      if (a.qty >= 16) { neededQty = a.qty/16; neededUnit = 'lb'; }
    } else if (a.family === 'volume') {
      neededQty = a.qty; neededUnit = 'tsp';
      if (a.qty >= 48) { neededQty = a.qty/48; neededUnit = 'cup'; }
      else if (a.qty >= 3) { neededQty = a.qty/3; neededUnit = 'tbsp'; }
    } else {
      neededQty = a.qty; neededUnit = a.unit;
    }

    // Special: garlic clove -> head
    if (a.item === 'garlic' && a.unit === 'clove') {
      const heads = a.qty / 10;
      const nHeads = Math.ceil(heads);
      buyQty = nHeads; buyUnit = 'head';
      displayText = `${nHeads} head garlic (~10 cloves each)`;
      if (heads < nHeads * 0.25) leftoverNote = `(only ~${heads.toFixed(1)} heads needed)`;
    } else if (pu) {
      if (pu.mode === 'by-weight') {
        const ri = pu.roundIncrement;
        let needLb;
        if (a.family === 'weight') needLb = a.qty / 16;
        else needLb = neededQty;
        const rounded = Math.ceil(needLb / ri) * ri;
        buyQty = rounded; buyUnit = pu.packageUnit;
        displayText = `~${rounded} ${pu.packageUnit} ${a.item}`;
        if (needLb < rounded * 0.25) leftoverNote = `(only ~${needLb.toFixed(1)} ${pu.packageUnit} needed)`;
      } else {
        // package mode
        let needInPkgUnit = neededQty;
        const pkgUnit = pu.packageUnit;
        const pkgSize = pu.packageSize;
        const pkgFam = VOL_TO_TSP[pkgUnit] ? 'volume' : (WEIGHT_TO_OZ[pkgUnit] ? 'weight' : 'count');
        let crossFamily = false;
        // Convert to pkg unit if same family
        if (a.family === 'weight' && pkgFam === 'weight') {
          needInPkgUnit = a.qty / WEIGHT_TO_OZ[pkgUnit];
        } else if (a.family === 'volume' && pkgFam === 'volume') {
          needInPkgUnit = a.qty / VOL_TO_TSP[pkgUnit];
        } else if (a.family === 'volume' && pkgUnit === 'fl oz') {
          needInPkgUnit = a.qty / 6; // tsp->fl oz
        } else if (a.family === 'count' && pkgFam !== 'count') {
          // e.g. coconut milk: 2 cans (each) but pkg is fl oz
          // treat count as number of packages directly
          needInPkgUnit = a.qty * pkgSize;
        } else if (a.family === 'count' && pkgFam === 'count') {
          // e.g. lemon: need 10, pkg size 1 → buy 10; romaine: need 6, pkg size 3 → buy 2 packs
          needInPkgUnit = a.qty;
        } else {
          // Cross-family (volume vs weight, etc.) — can't convert reliably
          // Buy enough to cover the need; show need in display unit
          crossFamily = true;
          needInPkgUnit = pkgSize; // forces 1 pkg minimum
        }
        const nPkgs = Math.ceil(needInPkgUnit / pkgSize);
        buyQty = nPkgs; buyUnit = pu.packageLabel;
        const lbl = pu.packageLabel;
        let core;
        if (/^each$/i.test(lbl)) {
          core = `${nPkgs} ${nPkgs>1 ? pluralItem(a.item) : a.item}`;
        } else if (nPkgs > 1) {
          core = `${nPkgs} × ${lbl} ${a.item}`;
        } else {
          core = `${lbl} ${a.item}`;
        }
        displayText = crossFamily ? `${core} (need ~${fmtQty(neededQty)} ${neededUnit})` : core;
        const used = needInPkgUnit;
        const bought = nPkgs * pkgSize;
        // Only flag leftover when same family and not cross-family
        if (!crossFamily && used < bought * 0.25) leftoverNote = `(only ~${fmtQty(used)} ${pkgUnit} needed — large remainder)`;
      }
    } else {
      missingPU = true;
      buyQty = neededQty; buyUnit = neededUnit;
      displayText = `${fmtQty(neededQty)} ${neededUnit} ${a.item}`;
      unknownUnits.push(a.item);
    }

    // Preserve check state
    let checked = false;
    if (existingList) {
      const found = existingList.items.find(i => i.item === a.item);
      if (found) checked = found.checked;
    }

    listItems.push({
      item: a.item, aisle: a.aisle || 'condiments',
      neededQty, neededUnit, buyQty, buyUnit, displayText,
      leftoverNote, checked, missingPU,
    });
  }

  // Step 6: Sort by store walk
  const aisleRank = {};
  AISLE_ORDER.forEach((a,i) => aisleRank[a] = i);
  listItems.sort((a,b) => {
    const ra = aisleRank[a.aisle] ?? 99, rb = aisleRank[b.aisle] ?? 99;
    return ra !== rb ? ra - rb : a.item.localeCompare(b.item);
  });

  return {
    id: plan.id, planId: plan.id,
    generatedAt: new Date().toISOString(),
    items: listItems,
    unknownUnits: [...new Set(unknownUnits)],
    warnings,
  };
}

function pluralItem(name) {
  const n = (name||'').trim();
  if (!n) return n;
  if (/s$/i.test(n)) return n;            // already plural (e.g. "bell peppers")
  if (/[^aeiou]y$/i.test(n)) return n.slice(0,-1)+'ies';
  if (/(ch|sh|x|z)$/i.test(n)) return n+'es';
  return n+'s';
}

function fmtQty(n) {
  if (!n && n !== 0) return '';
  const r = Math.round(n * 100) / 100;
  if (Number.isInteger(r)) return String(r);
  // Try fractions
  const fracs = [[1,4,'¼'],[1,3,'⅓'],[1,2,'½'],[2,3,'⅔'],[3,4,'¾']];
  const whole = Math.floor(r);
  const frac = r - whole;
  for (const [n,d,sym] of fracs) {
    if (Math.abs(frac - n/d) < 0.06) return whole > 0 ? `${whole}${sym}` : sym;
  }
  return r.toFixed(1).replace(/\.0$/,'');
}

// ── Calorie roll-up ───────────────────────────────────────────────────────────
function calcPairCals(entry, recipeMap) {
  const recipe = recipeMap[entry.recipeId];
  if (!recipe) return null;
  const prefs = state.preferences;
  const hs = prefs.householdSize || 2;
  const band = CALORIE_WARN_BAND();
  if (recipe.isFinish && recipe.baseRecipeId) {
    const base = recipeMap[recipe.baseRecipeId];
    if (base && base.caloriesPerServing != null && recipe.caloriesPerServing != null) {
      return (base.caloriesPerServing + recipe.caloriesPerServing) * hs;
    }
  }
  if (recipe.caloriesPerServing != null) return recipe.caloriesPerServing * hs;
  return null;
}

// ── Rule checks ───────────────────────────────────────────────────────────────
const CUT_PORK_WORDS = ['pork chop','pork shoulder','pork roast','pork loin','pork tenderloin','bacon','ham','prosciutto'];
function ruleCheck(recipe, recipeMap) {
  const warns = [];
  if (!recipe) return warns;
  const prefs = state.preferences.dislikes || {};
  const tags = recipe.tags || [];
  if (prefs.noSoupsStews && (tags.includes('soup') || tags.includes('stew'))) warns.push('Contains soup/stew tag');
  if (prefs.asianOnlyThai) {
    const asian = ['chinese','japanese','korean','vietnamese','asian'];
    if (asian.some(a => tags.includes(a))) warns.push('Non-Thai East-Asian cuisine');
  }
  if (tags.includes('pressure-cooker') || tags.includes('instant-pot')) warns.push('Requires pressure cooker');
  if (prefs.noCutPork) {
    for (const ing of recipe.ingredients || []) {
      if (CUT_PORK_WORDS.some(w => ing.item.toLowerCase().includes(w))) {
        if (!ing.item.toLowerCase().includes('sausage')) { warns.push('Contains cut pork'); break; }
      }
    }
  }
  return warns;
}

// ── Cook log / ratings ────────────────────────────────────────────────────────
async function saveCookFeedback(recipeId, planEntryIdx, feedback) {
  const recipe = state.recipes.find(r => r.id === recipeId);
  if (!recipe) return;
  const entry = {
    date: new Date().toISOString().split('T')[0],
    difficulty: feedback.difficulty,
    actualMinutes: feedback.actualMinutes,
    liked: feedback.liked,
    changeNote: feedback.changeNote || '',
    text: `- ${new Date().toISOString().split('T')[0]} — Took ${feedback.actualMinutes} min. Difficulty ${feedback.difficulty}/5. Liked ${feedback.liked}/5.${feedback.changeNote ? ' Next: '+feedback.changeNote : ''}`,
  };
  recipe.feedbackLog = recipe.feedbackLog || [];
  recipe.feedbackLog.push(entry);
  // Recompute ratings
  const log = recipe.feedbackLog;
  const cc = log.length;
  recipe.ratings = {
    cookCount: cc,
    avgDifficulty: log.reduce((s,e) => s + e.difficulty, 0) / cc,
    avgActualMinutes: log.reduce((s,e) => s + e.actualMinutes, 0) / cc,
    liked: log.reduce((s,e) => s + e.liked, 0) / cc,
  };
  recipe.updatedAt = new Date().toISOString();
  await dbPut('recipes', {...recipe, _key: recipe.id});

  // Mark plan entry cooked
  const plan = getActivePlan();
  if (plan && planEntryIdx >= 0) {
    plan.entries[planEntryIdx].cooked = true;
    await dbPut('mealPlans', {...plan, _key: plan.id});
  }

  // Add to cookLog
  const logEntry = {id: Date.now(), recipeId, date: entry.date, ...feedback, env: dataMode(), pushed: false, _key: Date.now()};
  state.cookLog.push(logEntry);
  await dbPut('cookLog', logEntry);

  // Auto-decrement linked fridge inventory (manual override always available)
  const baseId = recipe.baseRecipeId || recipe.id;
  const invItem = (state.inventory||[]).find(x=>x.recipeId===baseId || x.recipeId===recipe.id);
  if (invItem && (invItem.fridge||0) > 0) {
    invItem.fridge = Math.max(0, (invItem.fridge||0) - 1);
    invItem.updatedAt = new Date().toISOString();
    await dbPut('inventory', {...invItem, _key: invItem.id});
  }

  showToast('Cook logged! Ratings updated.');
  render();
}

function showToast(msg, duration=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function confirm(title, msg, okLabel='OK') {
  return new Promise(res => {
    document.getElementById('conf-title').textContent = title;
    document.getElementById('conf-msg').textContent = msg;
    document.getElementById('conf-ok').textContent = okLabel;
    document.getElementById('confirm-ov').classList.remove('hidden');
    const ok = document.getElementById('conf-ok');
    const cancel = document.getElementById('conf-cancel');
    const done = v => {
      document.getElementById('confirm-ov').classList.add('hidden');
      ok.onclick = null; cancel.onclick = null;
      res(v);
    };
    ok.onclick = () => done(true);
    cancel.onclick = () => done(false);
  });
}

function slugify(title) {
  return title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function getAvatarColor(tags) {
  if (tags.includes('beef')) return '#7C2D12';
  if (tags.includes('chicken')) return '#78350F';
  if (tags.includes('turkey')) return '#713F12';
  if (tags.includes('italian')) return '#6B2D32';
  if (tags.includes('thai')) return '#14532D';
  if (tags.includes('indian')) return '#78350F';
  if (tags.includes('mediterranean') || tags.includes('greek')) return '#1E3A5F';
  return '#292524';
}

function fmtStars(n) {
  if (!n) return '–';
  return '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
}

function isLikelyFreezer(entry, plan) {
  if (entry.meal !== 'dinner') return false;
  const same = plan.entries.filter(e => e.recipeId === entry.recipeId && e.meal === 'dinner');
  if (same.length < 2) return false;
  const sorted = [...same].sort((a,b) => (a.dayDate||'').localeCompare(b.dayDate||''));
  const idx = sorted.findIndex(e => e.dayDate === entry.dayDate && e.dayLabel === entry.dayLabel);
  return idx > 0;
}

// ── Recipes Screen ────────────────────────────────────────────────────────────
function renderRecipesScreen() {
  const q = (window._recipeSearch||'').toLowerCase();
  const filter = window._recipeFilter || '';
  let recipes = state.recipes;
  if (q) recipes = recipes.filter(r => r.title.toLowerCase().includes(q) || (r.tags||[]).some(t=>t.includes(q)));
  if (filter === 'base') recipes = recipes.filter(r=>r.isBase);
  else if (filter === 'finish') recipes = recipes.filter(r=>r.isFinish);
  else if (filter === 'fav') recipes = recipes.filter(r=>r.ratings?.liked >= 4);
  else if (filter === 'new') recipes = recipes.filter(r=>!r.ratings?.cookCount);
  else if (filter) recipes = recipes.filter(r=>(r.tags||[]).includes(filter));

  const filters = [
    {k:'',l:'All'},{k:'base',l:'Bases'},{k:'finish',l:'Finishes'},
    {k:'fav',l:'⭐ Liked'},{k:'new',l:'Never Cooked'},
    {k:'chicken',l:'Chicken'},{k:'beef',l:'Beef'},{k:'salad',l:'Salads'},
  ];

  return `
    <div class="sh"><span class="stitle">Recipes</span></div>
    <div class="sb"><span>🔍</span><input placeholder="Search recipes…" value="${(window._recipeSearch||'').replace(/"/g,'&quot;')}" oninput="window._recipeSearch=this.value;render()"></div>

}

async function saveCapture(e, editId) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const type = fd.get('type');
  const title = fd.get('title').trim();
  if (!title) { showToast('Title required'); return; }
  
  const ingredients = [];
  let i = 0;
  while (true) {
    const item = fd.get(`ing_item_${i}`);
    if (item === null) break;
    if (item.trim()) {
      ingredients.push({
        item: item.trim(),
        qty: parseFloat(fd.get(`ing_qty_${i}`)) || 0,
        unit: (fd.get(`ing_unit_${i}`) || 'each').trim(),
        aisle: fd.get(`ing_aisle_${i}`) || 'produce',
        staple: !!fd.get(`ing_staple_${i}`),
      });
    }
    i++;
  }
  
  const steps = [];
  let s = 0;
  while (true) {
    const step = fd.get(`step_${s}`);
    if (step === null) break;
    if (step.trim()) steps.push(step.trim());
    s++;
  }
  
  const tags = (fd.get('tags')||'').split(',').map(t=>t.trim()).filter(Boolean);
  const baseRecipeId = fd.get('baseRecipeId') || null;
  
  const now = new Date().toISOString();
  const id = editId || slugify(title) + '-' + Date.now().toString(36);
  const recipe = {
    id, title,
    servings: parseInt(fd.get('servings'))||2,
    timeMinutes: parseInt(fd.get('timeMinutes'))||30,
    tags, source: fd.get('source')||'own',
    caloriesPerServing: fd.get('calories') ? parseInt(fd.get('calories')) : null,
    note: fd.get('note')||null,
    isBase: type==='base', isFinish: type==='finish',
    baseRecipeId: type==='finish' ? baseRecipeId : null,
    ingredients, steps,
    ratings: editId ? (state.recipes.find(r=>r.id===editId)?.ratings || {cookCount:0,avgDifficulty:null,avgActualMinutes:null,liked:null}) : {cookCount:0,avgDifficulty:null,avgActualMinutes:null,liked:null},
    feedbackLog: editId ? (state.recipes.find(r=>r.id===editId)?.feedbackLog || []) : [],
    sourcePhotoRef: null,
    createdAt: editId ? (state.recipes.find(r=>r.id===editId)?.createdAt||now) : now,
    updatedAt: now, _key: id,
  };
  
  await dbPut('recipes', recipe);
  if (editId) {
    const idx = state.recipes.findIndex(r=>r.id===editId);
    if (idx >= 0) state.recipes[idx] = recipe;
    else state.recipes.push(recipe);
  } else {
    state.recipes.push(recipe);
  }
  showToast(editId ? 'Recipe updated!' : 'Recipe saved!');
  navigate(`#/recipes/${id}`);
}

    return `<div class="sh"><span class="stitle">Grocery</span></div>

      <button class="btn-p" style="max-width:240px" onclick="generateList()">Make grocery list</button></div>`;
  }
  const weekly = gl.weekly && gl.weekly.length ? gl.weekly : [{week:1,label:'Buy now',items:gl.items||[]}];
  const genDate = new Date(gl.generatedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const splitNote = weekly.length>1 ? `<div style="font-size:13px;color:var(--text3);margin-bottom:12px">Fresh items are split by week so they don't wilt — buy each list at the start of its week. Shelf-stable items are all on “Buy now.”</div>` : '';

    const checked=sec.items.filter(i=>i.checked).length, total=sec.items.length;
    const rows = total ? sec.items.map((item,ii)=>`<div class="gr-row ${item.checked?'chk':''}">

      </div>`).join('') : '<div style="padding:14px;color:var(--text3);font-size:13px">Nothing fresh needed this week.</div>';
    const inlineCopy = si>0 ? `<div style="text-align:right;margin:6px 2px 2px"><button class="btn-t" style="font-size:13px" onclick="copyList('${plan.id}',${si})">📋 Copy this list</button></div>` : '';
    return `<div class="ssec">${esc(sec.label)} <span style="font-weight:400;color:var(--text3);font-size:13px">· ${checked}/${total}</span></div>${rows}${inlineCopy}`;

  const warnsHtml = gl.warnings?.length ? `<div class="banner bw" style="margin-bottom:16px"><span class="bico">⚠</span><div class="bbody">${gl.warnings.map(w=>`<div>${esc(w)}</div>`).join('')}</div></div>` : '';

    <div class="sh"><span class="stitle">Grocery</span></div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:8px">Generated ${genDate} · ${esc(plan.label)}</div>

    <div style="text-align:center;margin-top:14px"><button class="btn-t" style="font-size:13px" onclick="generateList()">↻ Regenerate</button></div>
    <div class="sticky"><button class="btn-p" onclick="copyList('${plan.id}',0)">📋 Copy ${weekly.length>1?'“Buy now” list':'for Notes'}</button></div>`;
}

async function generateList() {
  const plan = getActivePlan();
  if (!plan) return;
  const rm = getRecipeMap();
  const existing = state.groceryLists.find(g=>g.planId===plan.id);
  const built = buildWeeklyLists(plan, rm, state.pantry.items||[], state.purchaseUnits, state.aliasMap);
  const prev = {};
  if (existing && existing.weekly) existing.weekly.forEach(w=>w.items.forEach(it=>{ prev[w.week+'|'+(it.item||it.displayText)] = it.checked; }));
  built.weekly.forEach(w=>w.items.forEach(it=>{ it.checked = !!prev[w.week+'|'+(it.item||it.displayText)]; }));
  const gl = { planId: plan.id, generatedAt: new Date().toISOString(), weekly: built.weekly, items: built.weekly.flatMap(w=>w.items), unknownUnits: built.unknownUnits, warnings: built.warnings, _key: plan.id };
  await dbPut('groceryLists', gl);
  const idx = state.groceryLists.findIndex(g=>g.planId===plan.id);
  if (idx >= 0) state.groceryLists[idx] = gl; else state.groceryLists.push(gl);
  showToast(`Generated ${gl.items.length} items${built.weekly.length>1?` · ${built.weekly.length} trips`:''}`);
  render();
}

async function toggleGrocery(planId, si, ii) {
  const gl = state.groceryLists.find(g=>g.planId===planId);
  if (!gl || !gl.weekly || !gl.weekly[si] || !gl.weekly[si].items[ii]) return;
  const it = gl.weekly[si].items[ii];
  it.checked = !it.checked;
  gl.items = gl.weekly.flatMap(w=>w.items);
  await dbPut('groceryLists', gl);
  render();
}

async function copyList(planId, si) {
  const gl = state.groceryLists.find(g=>g.planId===planId);
  if (!gl) return;
  const sec = (gl.weekly && gl.weekly[si]) ? gl.weekly[si] : {items: gl.items||[]};
  const text = sec.items.map(i=>i.displayText).join('\n');
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); }
    else { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
    showToast('Copied — paste into Notes');
  } catch(e) { showToast('Copy failed — see console'); console.log('Grocery list:\n'+text); }
}

  p.dinnersPerWeek = parseInt(fd.get('dinnersPerWeek'))||6;
  p.calorieTargets = { rutger: parseInt(fd.get('calRutger'))||800, wife: parseInt(fd.get('calWife'))||600, pairPerDinner: (parseInt(fd.get('calRutger'))||800)+(parseInt(fd.get('calWife'))||600) };
  p.calorieWarnBand = [parseInt(fd.get('warnLow'))||1200, parseInt(fd.get('warnHigh'))||1800];
  p.dislikes = { cilantroOptional: !!fd.get('cilantroOptional'), noSoupsStews: !!fd.get('noSoupsStews'), noCutPork: !!fd.get('noCutPork'), asianOnlyThai: !!fd.get('asianOnlyThai') };
  p.cookingStyle = fd.get('cookingStyle')||'bulk-prep';
  await dbPut('preferences', {...p, _key:'singleton'});
  showToast('Preferences saved!');

async function savePurchaseUnit(e, oldKey) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const itemNorm = fd.get('itemNorm').trim().toLowerCase();
  const mode = fd.get('mode');
  const pu = { itemNorm, _key: itemNorm, mode,
    packageSize: mode==='package' ? parseFloat(fd.get('packageSize'))||null : null,
    packageUnit: fd.get('packageUnit')||'each',
    packageLabel: fd.get('packageLabel')||itemNorm,
    roundIncrement: mode==='by-weight' ? parseFloat(fd.get('roundIncrement'))||0.5 : null,
  };
  if (oldKey && oldKey !== itemNorm) await dbDelete('purchaseUnits', oldKey);
  await dbPut('purchaseUnits', pu);
  if (oldKey) {
    const idx = state.purchaseUnits.findIndex(p=>(p.itemNorm||p._key)===oldKey);
    if (idx >= 0) state.purchaseUnits[idx] = pu; else state.purchaseUnits.push(pu);
  } else { state.purchaseUnits.push(pu); }
  document.getElementById('pu-modal')?.remove();
  showToast('Saved!');
  render();
}

async function exportData() {
  const data = {
    exportedAt: new Date().toISOString(),
    recipes: state.recipes,
    mealPlans: state.mealPlans,
    groceryLists: state.groceryLists,
    pantry: state.pantry,

  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);

async function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const ok = await confirm('Import Data', 'This will replace all current data. Are you sure?', 'Import');
  if (!ok) return;
  const text = await file.text();
  const data = JSON.parse(text);
  // Clear all stores
  for (const s of STORES) await dbClear(s);
  // Re-insert
  for (const r of data.recipes||[]) await dbPut('recipes', {...r, _key: r.id});
  for (const p of data.mealPlans||[]) await dbPut('mealPlans', {...p, _key: p.id});
  for (const g of data.groceryLists||[]) await dbPut('groceryLists', {...g, _key: g.planId});
  if (data.pantry) await dbPut('pantry', {...data.pantry, _key:'singleton'});
  for (const pu of data.purchaseUnits||[]) await dbPut('purchaseUnits', {...pu, _key: pu.itemNorm||pu._key});
  if (data.preferences) await dbPut('preferences', {...data.preferences, _key:'singleton'});
  if (data.aliasMap) await dbPut('aliasMap', {data: data.aliasMap, _key:'singleton'});
  for (const cl of data.cookLog||[]) await dbPut('cookLog', cl);
  for (const cb of data.cookbookBacklog||[]) await dbPut('cookbookBacklog', {...cb, _key: cb.filename});
  await loadState();
  showToast('Import complete!');
  render();
}

async function resetToSeed() {
  const ok = await confirm('Reset to Seed Data', 'This will erase all your changes and restore the original data. Cannot be undone.', 'Reset');
  if (!ok) return;
  for (const s of STORES) await dbClear(s);
  await seedDB();
  await loadState();
  showToast('Reset complete!');
  navigate('#/plan');
}

// ── Smart planner ─────────────────────────────────────────────────────────────
function cuisineOf(r){ return (r?.tags||[]).find(t=>CUISINE_TAGS.includes(t)) || 'other'; }
function likeScore(r){ return (r?.ratings?.liked ?? 3); }

function pickBalancedFinishes(baseIds, count, excludeIds){
  const finishes = state.recipes.filter(r=>r.isFinish && baseIds.includes(r.baseRecipeId) && !excludeIds.includes(r.id));
  const items = finishes.map(f=>({f, cu:cuisineOf(f), like:likeScore(f)}));
  const picked=[]; const cuisineCount={}; let lastCu=null;
  while(picked.length<count){
    const cands = items.filter(x=>!picked.includes(x));
    if(!cands.length) break;
    const pref = cands.filter(x=>x.cu!==lastCu);
    const use = (pref.length?pref:cands).slice();
    use.sort((a,b)=>((cuisineCount[a.cu]||0)-(cuisineCount[b.cu]||0))||(b.like-a.like));
    const pick=use[0];
    picked.push(pick); cuisineCount[pick.cu]=(cuisineCount[pick.cu]||0)+1; lastCu=pick.cu;
  }
  return reorderNoAdjacent(picked.map(x=>x.f), cuisineOf);
}

function reorderNoAdjacent(list, cuf){
  const pool=list.slice(); const out=[]; let last=null;
  while(pool.length){
    const counts={}; pool.forEach(x=>{const c=cuf(x);counts[c]=(counts[c]||0)+1;});
    let cands=pool.filter(x=>cuf(x)!==last);
    if(!cands.length) cands=pool.slice();
    cands.sort((a,b)=>counts[cuf(b)]-counts[cuf(a)]);
    const pick=cands[0];
    out.push(pick); pool.splice(pool.indexOf(pick),1); last=cuf(pick);
  }
  return out;
}

function baseFinishVariety(b){
  const fs=state.recipes.filter(r=>r.isFinish&&r.baseRecipeId===b.id);
  return new Set(fs.map(cuisineOf)).size;
}

function dinnerDate(idx, week){
  const d=new Date('2026-06-23'); d.setDate(d.getDate()+idx+(week===2?7:0));
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return {dayDate:d.toISOString().split('T')[0], dayLabel:`${dayNames[d.getDay()]} ${monthNames[d.getMonth()]} ${d.getDate()}`};
}

function fillWeek1(baseIds){
  const s=_builderState;
  const existing=s.entries.filter(e=>e.meal==='dinner'&&(e.week===1||!e.week));
  const need=6-existing.length; if(need<=0) return 0;
  const excl=existing.map(e=>e.recipeId);
  const picks=pickBalancedFinishes(baseIds, need, excl);
  picks.forEach(f=>{
    const i=s.entries.filter(e=>e.meal==='dinner'&&(e.week===1||!e.week)).length;
    const {dayDate,dayLabel}=dinnerDate(i,1);
    s.entries.push({recipeId:f.id,servings:2,dayDate,dayLabel,meal:'dinner',week:1,cooked:false,ruleWarningDismissed:false});
  });
  return picks.length;
}

function suggestPlan(){
  const s=_builderState;
  const bases=state.recipes.filter(r=>r.isBase);
  if(!bases.length){ showToast('No base recipes in your library yet'); return; }
  const chicken=bases.filter(b=>(b.tags||[]).includes('chicken')).sort((a,b)=>(baseFinishVariety(b)-baseFinishVariety(a))||(likeScore(b)-likeScore(a)));
  const beef=bases.filter(b=>(b.tags||[]).includes('beef')).sort((a,b)=>(baseFinishVariety(b)-baseFinishVariety(a))||(likeScore(b)-likeScore(a)));
  const chosen=[]; if(chicken[0])chosen.push(chicken[0]); if(beef[0])chosen.push(beef[0]);
  for(const b of bases){ if(chosen.length<2 && !chosen.includes(b)) chosen.push(b); }
  s.kind='bulk-2week';
  s.entries=[];
  chosen.forEach(b=>s.entries.push({recipeId:b.id,servings:b.servings||12,dayDate:'2026-06-22',dayLabel:'Sun Jun 22 (batch cook)',meal:'batch',cooked:false,ruleWarningDismissed:false}));
  fillWeek1(chosen.map(b=>b.id));
  fillWeek2Silent();
  const lunches=state.recipes.filter(r=>(r.tags||[]).some(t=>['lunch','salad'].includes(t)));
  const lc=lunches.filter(l=>(l.tags||[]).includes('chicken'))[0];
  const lb=lunches.filter(l=>(l.tags||[]).includes('beef'))[0];
  const chosenL=[lc,lb].filter(Boolean);
  for(const l of lunches){ if(chosenL.length<2 && !chosenL.includes(l)) chosenL.push(l); }
  const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const wkLunch=(start)=>{ const out=[]; for(let i=0;i<4;i++){ const d=new Date(start); d.setDate(d.getDate()+i); out.push({date:d.toISOString().split('T')[0], label:`${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]} ${mn[d.getMonth()]} ${d.getDate()}`}); } return out; };
  const lunchDays=[...wkLunch(new Date('2026-06-23')), ...wkLunch(new Date('2026-06-30'))]; // Mon–Thu, both weeks
  chosenL.forEach(l=>lunchDays.forEach(ld=>s.entries.push({recipeId:l.id,servings:2,dayDate:ld.date,dayLabel:ld.label,meal:'lunch',cooked:false,ruleWarningDismissed:false})));
  s.step=5; render(); showToast('Suggested a plan ✨ — tweak or save');
}

    createdAt: s.editingExisting ? (getActivePlan()?.createdAt||now) : now,
    updatedAt: now, _key: id,
  };
  // Deactivate other plans
  for (const p of state.mealPlans) {
    if (p.id !== id && p.isActive) {
      p.isActive = false;
      await dbPut('mealPlans', {...p, _key:p.id});

  const idx = state.mealPlans.findIndex(p=>p.id===id);
  if (idx >= 0) state.mealPlans[idx] = plan;
  else state.mealPlans.push(plan);
  state.mealPlans.forEach(p=>{ if(p.id!==id) p.isActive=false; });

const SYNC = { busy:false };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function syncUrl(){ try{ return localStorage.getItem('mp_sync_url')||''; }catch(e){ return ''; } }

async function pushFeedback(){
  const base = (syncUrl().replace(/\/+$/,'')) || ((typeof location!=='undefined' && location.origin && location.origin!=='null') ? location.origin : '');
  if(!base) return {pushed:0};
  const unsent = state.cookLog.filter(c=>!c.pushed);
  if(!unsent.length) return {pushed:0};
  const resp = await fetch(base + '/feedback', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ entries: unsent.map(c=>({...c, env: c.env||'test'})) }) });
  if(!resp.ok) throw new Error('feedback push failed ('+resp.status+')');
  for(const c of unsent){ c.pushed = true; await dbPut('cookLog', c); }
  return {pushed: unsent.length};
}

async function fetchSyncBundle(){
  let base = syncUrl().replace(/\/+$/,'');
  if(!base){ base = (typeof location!=='undefined' && location.origin && location.origin!=='null') ? location.origin : ''; }
  if(!base) throw new Error('Set your Mac mini address first (More - Sync from Claude).');
  let resp;
  try{ resp = await fetch(base + '/sync.json', {cache:'no-store'}); }
  catch(e){ throw new Error("Couldn't reach your sync server — check you're on Tailscale and the Mac mini is running."); }
  if(!resp.ok) throw new Error('Server returned '+resp.status);
  const data = await resp.json();
  if(!data || !Array.isArray(data.recipes)) throw new Error('That address did not return a meal bundle.');
  return data;
}

async function applySyncBundle(b){
  let added=0, updated=0;
  const localById = Object.fromEntries(state.recipes.map(r=>[r.id,r]));
  for(const inc of (b.recipes||[])){
    const loc = localById[inc.id];
    const merged = {...inc, _key:inc.id};
    if(loc){ // preserve local cook history so syncing never wipes feedback
      if(loc.ratings && (loc.ratings.cookCount||0)>0) merged.ratings = loc.ratings;
      if(loc.feedbackLog) merged.feedbackLog = loc.feedbackLog;
      updated++;
    } else added++;
    await dbPut('recipes', merged);
  }
  if(Array.isArray(b.mealPlans)){
    const localPlans = Object.fromEntries(state.mealPlans.map(p=>[p.id,p]));
    for(const inc of b.mealPlans){
      const lp = localPlans[inc.id];
      let entries = inc.entries||[];
      if(lp){ // keep cooked check-offs by entry signature
        const ck = {}; (lp.entries||[]).forEach(e=>{ ck[e.recipeId+'|'+e.dayDate+'|'+e.meal] = e.cooked; });
        entries = entries.map(e=>({...e, cooked: ((ck[e.recipeId+'|'+e.dayDate+'|'+e.meal] ?? e.cooked) || false)}));
      }
      const carry = {};
      if (lp) {
        const newDates = new Set((inc.entries||[]).map(e=>e.dayDate).filter(Boolean));
        const byDate = obj => Object.fromEntries(Object.entries(obj||{}).filter(([d]) => newDates.has(d)));
        if (lp.dinnerChoices) carry.dinnerChoices = byDate(lp.dinnerChoices);
        if (lp.dinnerLogged)  carry.dinnerLogged  = byDate(lp.dinnerLogged);
        if (lp.lunchChoices)  carry.lunchChoices  = byDate(lp.lunchChoices);
        if (lp.lunchLogged)   carry.lunchLogged   = byDate(lp.lunchLogged);
      }
      await dbPut('mealPlans', {...inc, entries, ...carry, _key:inc.id});
    }
    const allPlans = await dbGetAll('mealPlans');
    const wantActive = {}; b.mealPlans.forEach(p=>{ wantActive[p.id]=!!p.isActive; });
    const anyActive = b.mealPlans.some(p=>p.isActive);
    for(const p of allPlans){ const a = anyActive ? !!wantActive[p.id] : ((p.id in wantActive)? wantActive[p.id] : p.isActive); if(p.isActive!==a){ await dbPut('mealPlans',{...p,isActive:a,_key:p.id}); } }
  }
  if(b.pantry) await dbPut('pantry', {...b.pantry, _key:'singleton'});
  if(Array.isArray(b.purchaseUnits)){ for(const pu of b.purchaseUnits){ await dbPut('purchaseUnits', {...pu, _key: pu.itemNorm || slugify(pu.item||'x')}); } }
  if(b.aliasMap) await dbPut('aliasMap', {data:b.aliasMap, _key:'singleton'});
  if(Array.isArray(b.cookbookBacklog)){ for(const cb of b.cookbookBacklog){ await dbPut('cookbookBacklog', {...cb, _key:cb.filename}); } }
  if(b.preferences){ const lp=state.preferences||{}; await dbPut('preferences', {...b.preferences, theme:lp.theme, aiModel:lp.aiModel, _key:'singleton'}); }
  await loadState(); applyTheme();
  try{ localStorage.setItem('mp_sync_last', new Date().toISOString()); }catch(e){}
  return {added, updated};
}

async function doSync(opts){
  opts = opts||{};
  if(SYNC.busy) return;
  SYNC.busy=true; if(!opts.silent) render();
  try{
    let pushed = 0;
    try{ pushed = (await pushFeedback()).pushed; }catch(pe){ console.log('feedback push skipped:', pe.message||pe); }
    const b = await fetchSyncBundle();
    const r = await applySyncBundle(b);
    if(!opts.silent) showToast(`Synced — ${r.added} new, ${r.updated} updated${pushed?`, ${pushed} feedback sent`:''}`);
  }catch(e){
    if(!opts.silent) showToast('Sync failed: '+(e.message||e));
    else console.log('Auto-sync skipped:', e.message||e);
  }
  SYNC.busy=false; render();
}
